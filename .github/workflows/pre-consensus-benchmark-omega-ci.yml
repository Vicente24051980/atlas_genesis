name: Pre-Consensus Benchmark Omega CI

on:
  pull_request:
    paths:
      - 'src/atlas/algorithm/pre-consensus-benchmark-omega.ts'
      - 'src/atlas/algorithm/pre-consensus-benchmark-omega.test.ts'
      - 'CURRENT_CANON/2026-09-05_PRE_CONSENSUS_BENCHMARK_OMEGA_V1.md'
      - '.github/workflows/pre-consensus-benchmark-omega-ci.yml'
  push:
    branches:
      - 'feature/143-pre-consensus-benchmark'

permissions:
  contents: read

jobs:
  benchmark-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run benchmark tests
        run: npx --yes vitest@3.2.4 run --globals src/atlas/algorithm/pre-consensus-benchmark-omega.test.ts
