name: Mobile CI & EAS APK Build

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch or ref to verify/build'
        required: true
        default: 'main'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-schema:
    name: TypeScript Check & Schema Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install mobile dependencies
        run: npm install

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

  build-apk:
    name: Build Preview APK
    needs: typecheck-and-schema
    # Temporary same-repository checkpoint: PR execution is allowed here only.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Check EXPO_TOKEN availability
        id: expo_token
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not configured; using local Android fallback build."
          fi

      - name: Setup Expo & EAS CLI
        if: steps.expo_token.outputs.available == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies for EAS
        if: steps.expo_token.outputs.available == 'true'
        run: npm install

      - name: Build Android APK with EAS
        if: steps.expo_token.outputs.available == 'true'
        run: eas build --platform android --profile preview --non-interactive

      - name: Setup Java 17 for local fallback
        if: steps.expo_token.outputs.available != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies for local fallback
        if: steps.expo_token.outputs.available != 'true'
        run: npm install

      - name: Generate Android native project
        if: steps.expo_token.outputs.available != 'true'
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build local release APK with Gradle
        if: steps.expo_token.outputs.available != 'true'
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload local APK artifact
        if: steps.expo_token.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
