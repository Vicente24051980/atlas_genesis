name: ATLAS Ω Mobile + API Certification

on:
  push:
    branches: [main]
    paths: ['mobile/**','backend/**','.github/workflows/mobile-ci-eas-apk.yml']
  pull_request:
    branches: [main]
    types: [opened,reopened,ready_for_review,synchronize]
    paths: ['mobile/**','backend/**','.github/workflows/mobile-ci-eas-apk.yml']
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch or ref to verify/build'
        required: true
        default: 'main'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend-safety-gate:
    name: Backend API Safety Gate
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - name: Syntax verification
        run: npm run check
      - name: Backend invariant + engine fixtures
        run: npm test

  typecheck-and-semantic-gate:
    name: TypeScript + Semantic Verification
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - run: npm install
      - name: Run TypeScript typecheck
        run: npm run typecheck
      - name: Run deterministic mobile semantic fixtures
        run: npm run semantic:gate

  build-candidate-apk:
    name: Build Android E2E Candidate APK
    needs: [backend-safety-gate,typecheck-and-semantic-gate]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    env:
      EXPO_PUBLIC_ATLAS_API_BASE_URL: http://10.0.2.2:8787
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm install
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Permit fixture cleartext only in E2E candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          if 'android:usesCleartextTraffic=' in text:
              import re
              text = re.sub(r'android:usesCleartextTraffic="[^"]*"', 'android:usesCleartextTraffic="true"', text, count=1)
          else:
              text = text.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          path.write_text(text)
          assert 'android:usesCleartextTraffic="true"' in text
          print('E2E-only cleartext enabled for 10.0.2.2 fixture build')
          PY
      - name: Build release APK with Gradle
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-e2e-candidate-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  functional-emulator-smoke:
    name: Functional + Semantic Android Emulator Gate
    needs: build-candidate-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - uses: actions/download-artifact@v4
        with: { name: atlas-omega-e2e-candidate-apk, path: candidate-apk }
      - name: Start deterministic ATLAS API fixture
        shell: bash
        run: |
          node backend/fixture-server.mjs >/tmp/atlas-fixture.log 2>&1 &
          echo $! >/tmp/atlas-fixture.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8787/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/v1/audit/NVDA | grep -q 'ATLAS-FUNDAMENTAL-AUDIT-1.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app, run AUDIT Ω and verify routes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/android-functional-smoke.sh
      - name: Upload E2E-certified fixture APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-e2e-certified-apk
          path: candidate-apk/*.apk
          if-no-files-found: error

  production-apk-after-certification:
    name: Production APK (only with deployed backend URL)
    needs: functional-emulator-smoke
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_ATLAS_API_BASE_URL: ${{ secrets.ATLAS_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - name: Check production prerequisites
        id: prereq
        shell: bash
        run: |
          if [ -n "$EXPO_TOKEN" ] && [ -n "$EXPO_PUBLIC_ATLAS_API_BASE_URL" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Production APK skipped: EXPO_TOKEN and/or ATLAS_API_BASE_URL not configured."
          fi
      - if: steps.prereq.outputs.ready == 'true'
        uses: expo/expo-github-action@v8
        with: { eas-version: latest, token: "${{ secrets.EXPO_TOKEN }}" }
      - if: steps.prereq.outputs.ready == 'true'
        run: npm install
      - name: Verify deployed backend before production build
        if: steps.prereq.outputs.ready == 'true'
        run: curl -fsS "$EXPO_PUBLIC_ATLAS_API_BASE_URL/health" | grep -q 'ATLAS Ω Backend'
      - name: Build production-connected preview APK
        if: steps.prereq.outputs.ready == 'true'
        run: eas build --platform android --profile preview --non-interactive
