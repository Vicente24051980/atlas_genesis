# Rebuild marker: 2026-08-23 strict tuple fix validation on current main
name: ATLAS Ω Mobile v1 Clean Rebuild

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'mobile/**'
      - 'api/main.py'
      - 'api/mobile_v2.py'
      - 'api/mobile_audit_omega.py'
      - 'api/test_mobile_audit_omega.py'
      - 'api/test_mobile_v2.py'
      - 'api/test_mobile_entrypoints.py'
      - 'api/test_deployment_contract.py'
      - 'api/trading212_v2.py'
      - 'api/test_trading212_v2.py'
      - 'api/global_capex_chain_mobile.py'
      - 'api/test_global_capex_chain_mobile.py'
      - 'api/screener.py'
      - 'tests/test_screener.py'
      - 'api/app.py'
      - 'render.yaml'
      - '.github/workflows/mobile-ci-eas-apk.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'api/main.py'
      - 'api/mobile_v2.py'
      - 'api/mobile_audit_omega.py'
      - 'api/test_mobile_audit_omega.py'
      - 'api/test_mobile_v2.py'
      - 'api/test_mobile_entrypoints.py'
      - 'api/test_deployment_contract.py'
      - 'api/trading212_v2.py'
      - 'api/test_trading212_v2.py'
      - 'api/global_capex_chain_mobile.py'
      - 'api/test_global_capex_chain_mobile.py'
      - 'api/screener.py'
      - 'tests/test_screener.py'
      - 'api/app.py'
      - 'render.yaml'
      - '.github/workflows/mobile-ci-eas-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-mobile-v1-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCTION_API: https://atlas-genesis.onrender.com

jobs:
  api-unit:
    name: Mobile backend + audit + Trading 212 + CAPEX + screener + deployment + entrypoint tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r api/requirements.txt
      - run: PYTHONPATH=. pytest -q api/test_mobile_v2.py api/test_mobile_audit_omega.py api/test_trading212_v2.py api/test_global_capex_chain_mobile.py api/test_mobile_entrypoints.py api/test_deployment_contract.py tests/test_screener.py

  typecheck:
    name: Mobile TypeScript gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm install --include=dev --no-audit --no-fund
      - name: Verify deterministic Expo native ABI set
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const expected = {
            expo: '57.0.11',
            'expo-modules-core': '57.0.12',
            'react-native': '0.86.2',
          };
          for (const [pkg, want] of Object.entries(expected)) {
            const got = require(`./node_modules/${pkg}/package.json`).version;
            if (got !== want) throw new Error(`${pkg}: expected ${want}, got ${got}`);
            console.log(`${pkg}=${got}`);
          }
          for (const pkg of ['react-native-reanimated', 'react-native-worklets']) {
            try {
              require.resolve(`${pkg}/package.json`);
              throw new Error(`${pkg}: must not be installed; ATLAS does not use it and it re-enables the incompatible WorkletJSCallInvoker native path`);
            } catch (error) {
              if (error && error.code === 'MODULE_NOT_FOUND') console.log(`${pkg}=ABSENT`);
              else throw error;
            }
          }
          NODE
      - run: npx tsc --noEmit

  build:
    name: Build clean Android APK
    needs: [api-unit, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_ATLAS_API_BASE_URL: https://atlas-genesis.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install --include=dev --no-audit --no-fund
      - name: Verify deterministic Expo native ABI set
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const expected = {
            expo: '57.0.11',
            'expo-modules-core': '57.0.12',
            'react-native': '0.86.2',
          };
          for (const [pkg, want] of Object.entries(expected)) {
            const got = require(`./node_modules/${pkg}/package.json`).version;
            if (got !== want) throw new Error(`${pkg}: expected ${want}, got ${got}`);
            console.log(`${pkg}=${got}`);
          }
          for (const pkg of ['react-native-reanimated', 'react-native-worklets']) {
            try {
              require.resolve(`${pkg}/package.json`);
              throw new Error(`${pkg}: must not be installed`);
            } catch (error) {
              if (error && error.code === 'MODULE_NOT_FOUND') console.log(`${pkg}=ABSENT`);
              else throw error;
            }
          }
          NODE
      - name: Generate Android project
        env:
          CI: '1'
          NODE_ENV: production
        run: npx expo prebuild --platform android --clean
      - name: Harden Gradle memory for native release build
        shell: bash
        run: |
          set -euo pipefail
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\n' >> android/gradle.properties
      - name: Build release APK
        env:
          NODE_ENV: production
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Certify backend URL and keep provider keys server-side
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          unzip -p "$APK" assets/index.android.bundle > /tmp/index.android.bundle
          grep -Fq "$PRODUCTION_API" /tmp/index.android.bundle
          if grep -Fq 'financialdata.net/api/v1' /tmp/index.android.bundle; then exit 1; fi
          if grep -Fq 'live.trading212.com/api/v0' /tmp/index.android.bundle || grep -Fq 'demo.trading212.com/api/v0' /tmp/index.android.bundle; then exit 1; fi
          if grep -Eq 'fc-[A-Za-z0-9_-]{20,}' /tmp/index.android.bundle; then exit 1; fi
          sha256sum "$APK" | tee /tmp/atlas-mobile-v1.sha256
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-mobile-v1-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  phone-ui-gate:
    name: Android launch + navigation gate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: atlas-omega-mobile-v1-apk
          path: candidate-apk
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and verify clean navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/android-functional-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-mobile-v1-certified-apk
          path: candidate-apk/*.apk
          if-no-files-found: error
          retention-days: 30
