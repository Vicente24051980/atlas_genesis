name: ATLAS Ω Mobile + API Certification

on:
  push:
    branches: [main]
    paths: ['mobile/**','backend/**','.github/workflows/mobile-ci-eas-apk.yml']
  pull_request:
    branches: [main]
    types: [opened,reopened,ready_for_review,synchronize]
    paths: ['mobile/**','backend/**','.github/workflows/mobile-ci-eas-apk.yml']
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch or ref to verify/build'
        required: true
        default: 'main'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend-safety-gate:
    name: Backend API Safety Gate
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - name: Syntax verification
        run: npm run check
      - name: Backend invariant + engine fixtures
        run: npm test

  typecheck-and-semantic-gate:
    name: TypeScript + Semantic Verification
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - run: npm install
      - name: Run TypeScript typecheck
        run: npm run typecheck
      - name: Run deterministic mobile semantic fixtures
        run: npm run semantic:gate

  build-candidate-apk:
    name: Build Android CI Fixture APK (NOT FOR PHONE)
    needs: [backend-safety-gate,typecheck-and-semantic-gate]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    env:
      EXPO_PUBLIC_ATLAS_API_BASE_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm install
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Permit fixture cleartext only in CI APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          if 'android:usesCleartextTraffic=' in text:
              import re
              text = re.sub(r'android:usesCleartextTraffic="[^"]*"', 'android:usesCleartextTraffic="true"', text, count=1)
          else:
              text = text.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          path.write_text(text)
          assert 'android:usesCleartextTraffic="true"' in text
          print('CI-only cleartext enabled for adb-reversed localhost fixture')
          PY
      - name: Build CI fixture APK with Gradle
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-CI-FIXTURE-NOT-FOR-PHONE
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  functional-emulator-smoke:
    name: Functional + Semantic Android Emulator Gate
    needs: build-candidate-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - uses: actions/download-artifact@v4
        with: { name: atlas-omega-CI-FIXTURE-NOT-FOR-PHONE, path: candidate-apk }
      - name: Start deterministic ATLAS API fixture
        shell: bash
        run: |
          node backend/fixture-server.mjs >/tmp/atlas-fixture.log 2>&1 &
          echo $! >/tmp/atlas-fixture.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8787/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/v1/audit/NVDA | grep -q 'ATLAS-FUNDAMENTAL-AUDIT-1.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app, run AUDIT Ω and verify routes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/android-functional-smoke.sh
      - name: Upload E2E-certified fixture APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-CI-FIXTURE-CERTIFIED-NOT-FOR-PHONE
          path: candidate-apk/*.apk
          if-no-files-found: error

  production-apk-after-certification:
    name: Installable Phone APK (HTTPS backend required)
    needs: functional-emulator-smoke
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    env:
      EXPO_PUBLIC_ATLAS_API_BASE_URL: ${{ secrets.ATLAS_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Check phone-build backend prerequisite
        id: prereq
        shell: bash
        run: |
          if [ -z "$EXPO_PUBLIC_ATLAS_API_BASE_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Phone APK skipped: ATLAS_API_BASE_URL GitHub secret is not configured."
            exit 0
          fi
          case "$EXPO_PUBLIC_ATLAS_API_BASE_URL" in
            https://*) ;;
            *) echo "::error::ATLAS_API_BASE_URL must be HTTPS for a phone build"; exit 1;;
          esac
          case "$EXPO_PUBLIC_ATLAS_API_BASE_URL" in
            *127.0.0.1*|*localhost*|*10.0.2.2*) echo "::error::Loopback/emulator backend URL is forbidden in a phone APK"; exit 1;;
          esac
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - name: Verify deployed backend before phone build
        if: steps.prereq.outputs.ready == 'true'
        run: curl -fsS "$EXPO_PUBLIC_ATLAS_API_BASE_URL/health" | grep -q 'ATLAS Ω Backend'
      - if: steps.prereq.outputs.ready == 'true'
        run: npm install
      - name: Generate production Android native project
        if: steps.prereq.outputs.ready == 'true'
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Enforce production network policy
        if: steps.prereq.outputs.ready == 'true'
        shell: bash
        run: |
          if grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml; then
            echo "::error::Phone APK unexpectedly allows cleartext traffic"
            exit 1
          fi
          echo "Production network policy: HTTPS only"
      - name: Build installable phone APK with Gradle
        if: steps.prereq.outputs.ready == 'true'
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Upload installable phone APK
        if: steps.prereq.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-PHONE-APK
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
