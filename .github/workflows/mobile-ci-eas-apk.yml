name: ATLAS Ω ONLINE Phone APK

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci-eas-apk.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci-eas-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-online-phone-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCTION_API: https://atlas-genesis.onrender.com

jobs:
  live-contract:
    name: Prove actual LIVE backend contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify live ATLAS v0.4 routes and real Finnhub data
        shell: bash
        run: |
          set -euo pipefail
          BASE="$PRODUCTION_API"
          test "$BASE" = 'https://atlas-genesis.onrender.com'
          curl -fsS --retry 5 --retry-delay 3 --max-time 45 "$BASE/health" -o /tmp/health.json
          curl -fsS --retry 5 --retry-delay 3 --max-time 45 "$BASE/v1/company/KO" -o /tmp/company.json
          curl -fsS --retry 5 --retry-delay 3 --max-time 45 "$BASE/v1/quote/SPY" -o /tmp/quote.json
          curl -fsS --retry 5 --retry-delay 3 --max-time 45 "$BASE/v1/decision/KO" -o /tmp/decision.json
          python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          c=json.load(open('/tmp/company.json'))
          q=json.load(open('/tmp/quote.json'))
          d=json.load(open('/tmp/decision.json'))
          assert h.get('ok') is True, h
          assert h.get('finnhub_configured') is True, h
          assert c.get('symbol') == 'KO', c
          assert isinstance(c.get('metrics'), dict) and c['metrics'], c
          assert q.get('ticker') == 'SPY' and q.get('price') is not None, q
          assert d.get('symbol') == 'KO' and d.get('decision') in {'BUY','NO_BUY'}, d
          assert isinstance(d.get('scores'), dict) and d['scores'], d
          print('LIVE BACKEND CONTRACT PASS')
          PY

  typecheck:
    name: TypeScript compatibility gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: npm install
      - run: npx tsc --noEmit

  build:
    name: Build production ONLINE APK
    needs: [live-contract, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_ATLAS_API_BASE_URL: https://atlas-genesis.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - name: Reject every obsolete API contract in the mobile client
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "const DEFAULT_PUBLIC_API = 'https://atlas-genesis.onrender.com';" core/api/atlasOnlineApi.ts
          grep -Fq '/v1/quote/' core/api/atlasOnlineApi.ts
          grep -Fq '/v1/decision/' core/api/atlasOnlineApi.ts
          if grep -Fq "request<MarketSnapshot>('/v1/market/snapshot'" core/api/atlasOnlineApi.ts; then exit 1; fi
          if grep -Fq "request<TrackedUniverse>('/v1/atlas/universe'" core/api/atlasOnlineApi.ts; then exit 1; fi
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build release APK locally with Gradle
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Certify production URL inside compiled APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          unzip -p "$APK" assets/index.android.bundle > /tmp/index.android.bundle
          grep -Fq 'https://atlas-genesis.onrender.com' /tmp/index.android.bundle
          if grep -Fq 'https://atlas-genesis-api.onrender.com' /tmp/index.android.bundle; then
            echo '::error::Dead Render hostname embedded in APK'
            exit 1
          fi
          sha256sum "$APK" | tee /tmp/atlas-apk.sha256
          ls -lh "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-online-candidate
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  phone-online-gate:
    name: Physical-contract Android ONLINE gate
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: atlas-omega-online-candidate
          path: candidate-apk
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch APK and require ONLINE + real production data
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/android-functional-smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-ONLINE-CERTIFIED-PHONE-APK
          path: candidate-apk/*.apk
          if-no-files-found: error
          retention-days: 30
