name: Mobile CI & EAS APK Build

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'api/**'
      - 'src/atlas/**'
      - 'CURRENT_CANON/**'
      - 'docs/canon/**'
      - 'tsconfig.atlas.json'
      - 'render.yaml'
      - '.github/workflows/mobile-ci-eas-apk.yml'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    paths:
      - 'mobile/**'
      - 'api/**'
      - 'src/atlas/**'
      - 'CURRENT_CANON/**'
      - 'docs/canon/**'
      - 'tsconfig.atlas.json'
      - 'render.yaml'
      - '.github/workflows/mobile-ci-eas-apk.yml'
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch or ref to verify/build'
        required: true
        default: 'main'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}
  cancel-in-progress: true

jobs:
  api-certification:
    name: API Syntax & Broker Guardrail Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Compile API
        run: python -m compileall -q api

      - name: Verify Broker Ω fail-closed guardrails
        shell: bash
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import api.main as main

          client = TestClient(main.app)

          status = client.get('/v1/broker/status')
          assert status.status_code == 200, status.text
          payload = status.json()
          assert payload['mode'] == 'PAPER', payload
          assert payload['configured'] is False, payload

          protected = client.get('/v1/broker/account')
          assert protected.status_code == 503, protected.text

          main.TRADING212_API_KEY = 'ci-key'
          main.TRADING212_API_SECRET = 'ci-secret'
          main.ATLAS_BROKER_CONTROL_TOKEN = 'ci-control'
          main.TRADING212_ENV = 'live'
          main.TRADING212_LIVE_TRADING_ENABLED = False

          live_locked = client.post(
              '/v1/broker/orders/market',
              headers={'X-Atlas-Broker-Token': 'ci-control'},
              json={'ticker': 'AAPL_US_EQ', 'quantity': 0.01, 'extended_hours': False, 'confirmation': 'EXECUTE_LIVE'},
          )
          assert live_locked.status_code == 403, live_locked.text

          main.TRADING212_ENV = 'demo'
          wrong_confirmation = client.post(
              '/v1/broker/orders/market',
              headers={'X-Atlas-Broker-Token': 'ci-control'},
              json={'ticker': 'AAPL_US_EQ', 'quantity': 0.01, 'extended_hours': False, 'confirmation': 'EXECUTE_LIVE'},
          )
          assert wrong_confirmation.status_code == 400, wrong_confirmation.text

          unauthorized = client.get('/v1/broker/positions', headers={'X-Atlas-Broker-Token': 'wrong'})
          assert unauthorized.status_code == 401, unauthorized.text
          print('Broker Ω guardrails: PASS')
          PY

  typecheck-and-schema:
    name: TypeScript Check & Schema Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Install mobile dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Compile and test ATLAS TypeScript engine
        working-directory: .
        run: |
          mobile/node_modules/.bin/tsc --project tsconfig.atlas.json
          node --test .atlas-build/evidence-ingestion/integrity.test.js

  build-candidate-apk:
    name: Build Android Candidate APK
    needs:
      - api-certification
      - typecheck-and-schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Generate Android native project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean

      - name: Build release APK with Gradle
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-candidate-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  functional-emulator-smoke:
    name: Functional Android Emulator Gate
    needs: build-candidate-apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}

      - name: Download candidate APK
        uses: actions/download-artifact@v4
        with:
          name: atlas-omega-candidate-apk
          path: candidate-apk

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app and verify all functional routes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/android-functional-smoke.sh

      - name: Publish functional APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-functional-apk
          path: candidate-apk/*.apk
          if-no-files-found: error

  eas-preview-after-functional-gate:
    name: Optional EAS Preview Build After Functional Gate
    needs: functional-emulator-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'

      - name: Check EXPO_TOKEN availability
        id: expo_token
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "EXPO_TOKEN is not configured; functional local APK remains the certified artifact."
          fi

      - name: Setup Expo & EAS CLI
        if: steps.expo_token.outputs.available == 'true'
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies for EAS
        if: steps.expo_token.outputs.available == 'true'
        run: npm ci

      - name: Build Android APK with EAS
        if: steps.expo_token.outputs.available == 'true'
        run: eas build --platform android --profile preview --non-interactive
