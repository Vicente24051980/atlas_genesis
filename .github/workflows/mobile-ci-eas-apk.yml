name: Mobile CI & ONLINE APK Build

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'api/**'
      - 'render.yaml'
      - '.github/workflows/mobile-ci-eas-apk.yml'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize
    paths:
      - 'mobile/**'
      - 'api/**'
      - 'render.yaml'
      - '.github/workflows/mobile-ci-eas-apk.yml'
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch or ref to verify/build'
        required: true
        default: 'main'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}
  cancel-in-progress: true

env:
  PRODUCTION_API: https://atlas-genesis.onrender.com

jobs:
  production-api-contract:
    name: LIVE Render API Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Wait for deployed ATLAS Ω API and verify mobile contract
        shell: bash
        run: |
          set -euo pipefail
          BASE="$PRODUCTION_API"
          case "$BASE" in https://*) ;; *) echo "::error::Production API must use HTTPS"; exit 1;; esac
          case "$BASE" in *localhost*|*127.0.0.1*|*10.0.2.2*|*atlas-genesis-api.onrender.com*) echo "::error::Invalid production API target: $BASE"; exit 1;; esac

          ok=0
          for attempt in $(seq 1 60); do
            echo "Render LIVE contract attempt $attempt/60"
            if curl -fsS --retry 2 --retry-delay 2 --max-time 30 "$BASE/health" -o /tmp/health.json \
              && curl -fsS --retry 2 --retry-delay 2 --max-time 45 "$BASE/v1/atlas/universe" -o /tmp/universe.json \
              && curl -fsS --retry 2 --retry-delay 2 --max-time 60 "$BASE/v1/market/snapshot" -o /tmp/snapshot.json; then
              if python3 - <<'PY'
          import json
          h=json.load(open('/tmp/health.json'))
          u=json.load(open('/tmp/universe.json'))
          s=json.load(open('/tmp/snapshot.json'))
          assert h.get('ok') is True, h
          assert h.get('finnhub_configured') is True, h
          counts=u.get('counts') or {}
          assert counts.get('portfolio', 0) > 0, u
          assert counts.get('watchlist', 0) > 0, u
          items=s.get('items') or []
          assert len(items) > 0, s
          assert any(item.get('price') is not None for item in items), s
          print('ATLAS Ω LIVE Render API contract: PASS')
          PY
              then
                ok=1
                break
              fi
            fi
            sleep 10
          done

          if [ "$ok" != 1 ]; then
            echo "::error::The deployed Render service never satisfied the mobile ONLINE contract. APK build blocked."
            echo "health:"; cat /tmp/health.json 2>/dev/null || true
            echo "universe:"; cat /tmp/universe.json 2>/dev/null || true
            echo "snapshot:"; cat /tmp/snapshot.json 2>/dev/null || true
            exit 1
          fi

  api-certification:
    name: API + ATLAS Engine + Broker Guardrail Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API dependencies
        run: pip install -r api/requirements.txt

      - name: Compile API
        run: python -m compileall -q api

      - name: Verify ATLAS Ω routes, decisions and Broker Ω fail-closed guardrails
        shell: bash
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          import api.main as main
          import api.atlas_core as atlas_core
          import api.market as market
          from api.app import app

          client = TestClient(app)
          universe = client.get('/v1/atlas/universe')
          assert universe.status_code == 200, universe.text
          u = universe.json()
          assert u['snapshotId'], u
          assert u['counts']['portfolio'] > 0, u
          assert u['counts']['watchlist'] > 0, u
          assert u['counts']['atlasTop80'] == 80, u
          assert u['status'] in {'AWAITING_USER_CONFIRMATION', 'CONFIRMED'}, u

          engines = client.get('/v1/atlas/engines')
          assert engines.status_code == 200, engines.text
          names = {item['name'] for item in engines.json()['items']}
          for required in ['Business Quality Ω', 'Growth Ω', 'CAPEX Productivity Ω', 'Valuation Ω', 'Risk Ω', 'Money Rotation Ω', 'Historical Dislocation Ω', 'Agentic Security Discovery Ω', 'Evidence Ingestion Ω']:
              assert required in names, (required, names)

          assert market._rotation_phase(-2.0, -10.0) == 'R3_BASE'
          assert market._rotation_phase(5.0, -4.0) == 'R4_EARLY_INFLOW'
          assert market._rotation_phase(5.0, 8.0) == 'R5_TREND'

          async def fake_market_quote(symbol: str):
              return {
                  'symbol': symbol, 'name': symbol, 'sector': 'TEST', 'price': 100.0,
                  'change': 1.0, 'changePct': 1.0, 'open': 99.0, 'high': 101.0,
                  'low': 98.0, 'previousClose': 99.0, 'volume': 1_000_000.0,
                  'asOfDate': '2026-08-07', 'asOfTime': '22:00:00',
                  'source': 'CI_FIXTURE', 'delayed': True,
              }

          fixture_metrics = {
              'roiTTM': 25.0, 'roeTTM': 30.0, 'roaTTM': 15.0,
              'grossMarginTTM': 60.0, 'netProfitMarginTTM': 25.0,
              'operatingMarginTTM': 25.0, 'assetTurnoverTTM': 1.5,
              'revenueGrowthTTMYoy': 20.0, 'epsGrowthTTMYoy': 20.0,
              'freeCashFlowGrowth5Y': 20.0, 'peTTM': 20.0, 'forwardPE': 20.0,
              'pbAnnual': 4.0, 'psTTM': 4.0, 'dividendYieldIndicatedAnnual': 1.0,
              'beta': 1.0, 'totalDebtToTotalEquityQuarterly': 20.0,
              'currentRatioQuarterly': 2.0, 'quickRatioQuarterly': 1.5,
              'interestCoverageTTM': 12.0, 'freeCashFlowPerShareTTM': 8.0,
              'capitalSpendingPerShareTTM': 2.0,
          }

          async def fake_fundamental(symbol: str):
              return {
                  'metrics': fixture_metrics,
                  'profile': {'name': f'{symbol} Fixture', 'finnhubIndustry': 'Technology'},
                  'recommendations': [],
                  'sourceStatus': {'metrics': 'CI_FIXTURE', 'profile': 'CI_FIXTURE', 'recommendations': 'CI_FIXTURE'},
              }

          atlas_core.get_market_quote = fake_market_quote
          atlas_core._fundamental_bundle = fake_fundamental
          candidate = client.get('/v1/atlas/analyze/TEST?context=candidate')
          assert candidate.status_code == 200, candidate.text
          ca = candidate.json()['analysis']
          assert ca['action'] == 'BUY', ca
          assert ca['actionLabel'] == 'COMPRAR', ca
          assert ca['scores']['businessQuality'] is not None, ca
          assert ca['scores']['capexProductivity'] is not None, ca

          top80 = client.get('/v1/atlas/top80?offset=0&limit=3')
          assert top80.status_code == 200, top80.text
          t80 = top80.json()
          assert t80['total'] == 80, t80
          assert len(t80['items']) == 3, t80
          assert {row['binaryDecision'] for row in t80['items']} == {'BUY'}, t80

          portfolio = client.get('/v1/atlas/analyze/TEST?context=portfolio')
          assert portfolio.status_code == 200, portfolio.text
          pa = portfolio.json()['analysis']
          assert pa['action'] in {'ADD', 'HOLD', 'WAIT', 'REVIEW'}, pa
          assert pa['action'] not in {'BUY', 'NO_BUY', 'SELL', 'EXIT'}, pa
          assert 'EXIT' in pa['guardrail'], pa

          status = client.get('/v1/broker/status')
          assert status.status_code == 200, status.text
          payload = status.json()
          assert payload['mode'] == 'PAPER', payload
          assert payload['configured'] is False, payload
          protected = client.get('/v1/broker/account')
          assert protected.status_code == 503, protected.text

          main.TRADING212_API_KEY = 'ci-key'
          main.TRADING212_API_SECRET = 'ci-secret'
          main.ATLAS_BROKER_CONTROL_TOKEN = 'ci-control'
          main.TRADING212_ENV = 'live'
          main.TRADING212_LIVE_TRADING_ENABLED = False
          live_locked = client.post('/v1/broker/orders/market', headers={'X-Atlas-Broker-Token': 'ci-control'}, json={'ticker': 'AAPL_US_EQ', 'quantity': 0.01, 'extended_hours': False, 'confirmation': 'EXECUTE_LIVE'})
          assert live_locked.status_code == 403, live_locked.text
          main.TRADING212_ENV = 'demo'
          wrong_confirmation = client.post('/v1/broker/orders/market', headers={'X-Atlas-Broker-Token': 'ci-control'}, json={'ticker': 'AAPL_US_EQ', 'quantity': 0.01, 'extended_hours': False, 'confirmation': 'EXECUTE_LIVE'})
          assert wrong_confirmation.status_code == 400, wrong_confirmation.text
          unauthorized = client.get('/v1/broker/positions', headers={'X-Atlas-Broker-Token': 'wrong'})
          assert unauthorized.status_code == 401, unauthorized.text
          print('ATLAS Ω API + engines + Broker guardrails: PASS')
          PY

  typecheck-and-schema:
    name: TypeScript Check & Schema Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Install mobile dependencies
        run: npm install
      - name: Run TypeScript typecheck
        run: npx tsc --noEmit

  build-candidate-apk:
    name: Build ONLINE Android APK
    needs:
      - production-api-contract
      - api-certification
      - typecheck-and-schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_ATLAS_API_BASE_URL: https://atlas-genesis.onrender.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Assert production API target
        shell: bash
        run: |
          test "$EXPO_PUBLIC_ATLAS_API_BASE_URL" = "https://atlas-genesis.onrender.com"
          grep -Fq "const DEFAULT_PUBLIC_API = 'https://atlas-genesis.onrender.com';" core/api/atlasOnlineApi.ts
          ! grep -Fq "const DEFAULT_PUBLIC_API = 'https://atlas-genesis-api.onrender.com';" core/api/atlasOnlineApi.ts
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Build release APK with Gradle
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Certify embedded production endpoint
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -s "$APK"
          unzip -p "$APK" assets/index.android.bundle > /tmp/index.android.bundle
          grep -Fq 'https://atlas-genesis.onrender.com' /tmp/index.android.bundle
          if grep -Fq 'https://atlas-genesis-api.onrender.com' /tmp/index.android.bundle; then
            echo "::error::Obsolete Render endpoint embedded in APK"
            exit 1
          fi
          sha256sum "$APK"
      - name: Upload ONLINE candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-online-candidate-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  functional-emulator-smoke:
    name: ONLINE Android Emulator Gate
    needs: build-candidate-apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}
      - name: Download ONLINE candidate APK
        uses: actions/download-artifact@v4
        with:
          name: atlas-omega-online-candidate-apk
          path: candidate-apk
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app and verify LIVE online operation and routes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/android-functional-smoke.sh
      - name: Publish certified ONLINE phone APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-ONLINE-PHONE-APK
          path: candidate-apk/*.apk
          if-no-files-found: error
          retention-days: 30
