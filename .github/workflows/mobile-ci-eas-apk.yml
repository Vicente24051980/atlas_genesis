name: ATLAS Ω Mobile + API Certification

on:
  push:
    branches: [main]
    paths: ['mobile/**','backend/**','.github/workflows/mobile-ci-eas-apk.yml']
  pull_request:
    branches: [main]
    types: [opened,reopened,ready_for_review,synchronize]
    paths: ['mobile/**','backend/**','.github/workflows/mobile-ci-eas-apk.yml']
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch or ref to verify/build'
        required: true
        default: 'main'
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend-safety-gate:
    name: Backend API Safety Gate
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - name: Syntax verification
        run: npm run check
      - name: Backend invariant + engine fixtures
        run: npm test

  typecheck-and-semantic-gate:
    name: TypeScript + Semantic Verification
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - run: npm install
      - name: Run TypeScript typecheck
        run: npm run typecheck
      - name: Run deterministic mobile semantic fixtures
        run: npm run semantic:gate

  build-candidate-apk:
    name: Build Android CI Fixture APK (NOT FOR PHONE)
    needs: [backend-safety-gate,typecheck-and-semantic-gate]
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    env:
      EXPO_PUBLIC_ATLAS_API_BASE_URL: http://127.0.0.1:8787
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm install
      - name: Generate Android native project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Permit fixture cleartext only in CI APK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          if 'android:usesCleartextTraffic=' in text:
              import re
              text = re.sub(r'android:usesCleartextTraffic="[^"]*"', 'android:usesCleartextTraffic="true"', text, count=1)
          else:
              text = text.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
          path.write_text(text)
          assert 'android:usesCleartextTraffic="true"' in text
          PY
      - name: Build CI fixture APK with Gradle
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-CI-FIXTURE-NOT-FOR-PHONE
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  functional-emulator-smoke:
    name: Functional + Semantic Android Emulator Gate
    needs: build-candidate-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - uses: actions/download-artifact@v4
        with: { name: atlas-omega-CI-FIXTURE-NOT-FOR-PHONE, path: candidate-apk }
      - name: Start deterministic ATLAS API fixture
        shell: bash
        run: |
          node backend/fixture-server.mjs >/tmp/atlas-fixture.log 2>&1 &
          echo $! >/tmp/atlas-fixture.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8787/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8787/v1/audit/NVDA | grep -q 'ATLAS-FUNDAMENTAL-AUDIT-1.0.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch app, run AUDIT Ω and verify routes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/android-functional-smoke.sh
      - name: Upload E2E-certified fixture APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-CI-FIXTURE-CERTIFIED-NOT-FOR-PHONE
          path: candidate-apk/*.apk
          if-no-files-found: error

  production-apk-after-certification:
    name: Installable Phone APK — Render Live
    needs: functional-emulator-smoke
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    env:
      EXPO_PUBLIC_ATLAS_API_BASE_URL: https://atlas-genesis.onrender.com
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: '22.13.0' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Verify live deployed backend
        shell: bash
        run: |
          case "$EXPO_PUBLIC_ATLAS_API_BASE_URL" in https://*) ;; *) exit 1;; esac
          curl --retry 5 --retry-delay 5 --max-time 90 -fsS "$EXPO_PUBLIC_ATLAS_API_BASE_URL/health" | tee /tmp/atlas-health.json
          grep -q '"ok":true' /tmp/atlas-health.json
          grep -q 'ATLAS Ω Backend' /tmp/atlas-health.json
          grep -q '"finnhub":"CONFIGURED"' /tmp/atlas-health.json
      - run: npm install
      - name: Final TypeScript gate
        run: npm run typecheck
      - name: Generate production Android native project
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Enforce production network policy
        shell: bash
        run: |
          case "$EXPO_PUBLIC_ATLAS_API_BASE_URL" in *127.0.0.1*|*localhost*|*10.0.2.2*) exit 1;; esac
          if grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml; then exit 1; fi
          echo 'Production policy PASS: HTTPS backend, no loopback, no cleartext.'
      - name: Build installable phone APK with Gradle
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Upload installable phone APK
        uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-PHONE-APK-Render-Live
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
