name: ATLAS Ω — Automatic APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/atlas-apk-auto.yml'

permissions:
  contents: write

env:
  APP_DIR: mobile
  EAS_PROFILE: preview

jobs:
  build-apk:
    name: Build ATLAS Ω APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'

      - name: Require Expo credentials
        shell: bash
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "${EXPO_TOKEN:-}" || { echo '::error::Missing EXPO_TOKEN'; exit 1; }
          test -n "${EAS_PROJECT_ID:-}" || { echo '::error::Missing EAS_PROJECT_ID'; exit 1; }

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: ${{ env.APP_DIR }}
        run: npm install

      - name: Link EAS project
        working-directory: ${{ env.APP_DIR }}
        env:
          EAS_PROJECT_ID: ${{ secrets.EAS_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'app.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.expo ??= {};
          config.expo.slug = 'atlas';
          config.expo.extra ??= {};
          config.expo.extra.eas ??= {};
          config.expo.extra.eas.projectId = process.env.EAS_PROJECT_ID;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE
          eas project:info --non-interactive

      - name: Build Android APK on EAS
        id: eas
        working-directory: ${{ env.APP_DIR }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform android --profile "$EAS_PROFILE" --non-interactive --wait --json > eas-build.json
          cat eas-build.json
          node <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('eas-build.json', 'utf8'));
          const build = Array.isArray(raw) ? raw[0] : raw;
          const url = build?.artifacts?.buildUrl || build?.artifacts?.applicationArchiveUrl || build?.artifactUrl;
          if (!url) throw new Error('EAS build completed but no APK artifact URL was found in JSON output.');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          NODE

      - name: Download APK
        working-directory: ${{ env.APP_DIR }}
        env:
          APK_URL: ${{ steps.eas.outputs.url }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "$APK_URL" --output ATLAS-Omega.apk
          test -s ATLAS-Omega.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-Omega-APK
          path: mobile/ATLAS-Omega.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        working-directory: ${{ env.APP_DIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="atlas-apk-${GITHUB_SHA::7}"
          gh release create "$TAG" ATLAS-Omega.apk --repo "$GITHUB_REPOSITORY" --title "ATLAS Ω APK ${GITHUB_SHA::7}" --notes "Automatic signed Android APK built by EAS from commit $GITHUB_SHA."