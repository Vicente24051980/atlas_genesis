name: ATLAS Ω — Publish Certified Mobile APK

on:
  workflow_run:
    workflows:
      - "ATLAS Ω Mobile v1 Clean Rebuild"
    types:
      - completed

permissions:
  contents: write
  actions: read

concurrency:
  group: atlas-certified-apk-release-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      ATLAS_PRODUCTION_API: ${{ vars.ATLAS_PRODUCTION_API }}

    steps:
      - name: Resolve certified build metadata
        id: meta
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          SHORT_SHA="${HEAD_SHA:0:7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=mobile-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "apk=ATLAS-Omega-${SHORT_SHA}.apk" >> "$GITHUB_OUTPUT"
          echo "source_run_id=$SOURCE_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Require exact live backend before certification
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          BASE="${ATLAS_PRODUCTION_API:-https://atlas-genesis.onrender.com}"
          BASE="${BASE%/}"
          curl -fsS --max-time 30 "$BASE/v1/mobile/health" > /tmp/mobile.json
          curl -fsS --max-time 30 "$BASE/v1/mobile/deployment" > /tmp/deployment.json
          curl -fsS --max-time 30 "$BASE/v1/agentic-omega/v2/governance/capabilities" > /tmp/governance.json
          curl -fsS --max-time 30 "$BASE/openapi.json" > /tmp/openapi.json
          python3 - <<'PY'
          import json, os
          m=json.load(open('/tmp/mobile.json'))
          d=json.load(open('/tmp/deployment.json'))
          g=json.load(open('/tmp/governance.json'))
          o=json.load(open('/tmp/openapi.json'))
          assert m.get('ok') is True and m.get('service') == 'atlas-mobile-v2'
          assert d.get('runtime') == 'render'
          assert d.get('sourceMatchesCanonical') is True
          assert d.get('repoSlug') == 'Vicente24051980/atlas_genesis'
          assert d.get('branch') == 'main'
          assert d.get('gitCommit') == os.environ['HEAD_SHA'], (d.get('gitCommit'), os.environ['HEAD_SHA'])
          assert d.get('secretsExposed') is False
          assert g.get('version') == '2.3-governance-evidence'
          assert g.get('unknownCapabilityFailsClosed') is True
          assert g.get('credentialValuesPersisted') is False
          paths=set((o.get('paths') or {}).keys())
          required={
              '/v1/mobile/health','/v1/mobile/deployment','/v1/mobile/indices',
              '/v1/mobile/company/{ticker}','/v1/mobile/catalysts','/v1/mobile/audit/{ticker}',
              '/v1/mobile/broker/status','/v1/mobile/broker/account','/v1/mobile/broker/positions',
              '/v1/mobile/broker/orders','/v1/mobile/broker/metadata/instruments/search'
          }
          missing=sorted(required-paths)
          assert not missing, f'live backend missing required routes: {missing}'
          PY
          echo "LIVE_BACKEND_EXACT_SHA_CERTIFIED=$HEAD_SHA"

      - name: Download emulator-certified APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.meta.outputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p certified-apk
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name atlas-omega-mobile-v1-certified-apk \
            --dir certified-apk
          SOURCE_APK="$(find certified-apk -type f -name '*.apk' | head -n 1)"
          test -s "$SOURCE_APK"
          cp "$SOURCE_APK" "${{ steps.meta.outputs.apk }}"
          sha256sum "${{ steps.meta.outputs.apk }}" | tee "${{ steps.meta.outputs.apk }}.sha256"

      - name: Create immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          APK_NAME: ${{ steps.meta.outputs.apk }}
          SOURCE_RUN_ID: ${{ steps.meta.outputs.source_run_id }}
        run: |
          set -euo pipefail
          NOTES="Certified ATLAS Ω Android APK. Source commit: ${HEAD_SHA}. Source CI run: ${SOURCE_RUN_ID}. Passed backend contract tests, TypeScript gate, release build, provider-secret leak inspection, Android emulator launch/navigation gate, and exact-SHA live Render backend certification."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK_NAME" "$APK_NAME.sha256" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$HEAD_SHA" \
              --title "ATLAS Ω Certified APK ${{ steps.meta.outputs.short_sha }}" \
              --notes "$NOTES" \
              "$APK_NAME" "$APK_NAME.sha256"
          fi
