name: FinancialData.Net Live Certification

on:
  workflow_dispatch:

jobs:
  certify:
    runs-on: ubuntu-latest
    env:
      FINANCIALDATANET_API_KEY: ${{ secrets.FINANCIALDATANET_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify secret is configured
        run: |
          if [ -z "$FINANCIALDATANET_API_KEY" ]; then
            echo "FINANCIALDATANET_API_KEY repository secret is not configured."
            exit 1
          fi
      - name: Install provider SDK
        run: python -m pip install --upgrade pip fdnpy
      - name: Run ATLAS Ω cross-market coverage certification
        run: >-
          python -m atlas_financiero.integrations.cli_certify
          MSFT GOOGL AMZN NVDA TSM ASML
          SU.PA:intl SAF.PA:intl TLX.DE:intl
