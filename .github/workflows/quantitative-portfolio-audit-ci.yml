name: Legacy Quantitative Portfolio Audit CI

on:
  pull_request:
    paths:
      - 'scripts/atlas_quant_portfolio_audit.py'
      - 'scripts/legacy_fixed_portfolio_guard.py'
      - 'scripts/test_atlas_quant_portfolio_audit.py'
      - '.github/workflows/quantitative-portfolio-audit-ci.yml'
  workflow_dispatch:

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    env:
      ATLAS_ALLOW_LEGACY_FIXED_PORTFOLIO: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check numpy pandas pytest yfinance
      - name: Unit tests
        working-directory: scripts
        run: pytest -q test_atlas_quant_portfolio_audit.py
      - name: Reproduce LEGACY N31 quantitative audit — no current portfolio authority
        run: python scripts/atlas_quant_portfolio_audit.py --start 2023-09-05 --end 2026-09-05 --outdir artifacts/quant-portfolio-audit
      - name: Upload legacy audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-legacy-quant-portfolio-audit
          path: artifacts/quant-portfolio-audit
