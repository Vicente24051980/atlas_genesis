name: ATLAS Ω Mobile Fast Smoke

on:
  push:
    branches: [rebuild/mobile-fdn-v1]
    paths:
      - '.github/workflows/mobile-fast-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  phone-ui:
    name: Certified APK navigation smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: atlas-omega-mobile-v1-apk
          path: candidate-apk
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31960025834
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and verify Home → Analyze → Portfolio → System
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/android-functional-smoke.sh
