name: ATLAS Architecture Consolidation CI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/architecture-consolidation-ci.yml'
      - 'src/atlas/algorithm/atlas-kernel-contract-registry-omega.ts'
      - 'src/atlas/algorithm/atlas-kernel-contract-registry-omega.test.ts'
      - 'src/atlas/algorithm/e5-control-policy-omega.ts'
      - 'src/atlas/algorithm/e5-control-policy-omega.test.ts'
      - 'src/atlas/algorithm/e6-assurance-harness-policy-omega.ts'
      - 'src/atlas/algorithm/e6-assurance-harness-policy-omega.test.ts'
      - 'src/atlas/algorithm/capital-blind-portfolio-selection-omega.ts'
      - 'src/atlas/algorithm/capital-blind-portfolio-selection-omega.test.ts'
      - 'src/atlas/algorithm/portfolio-selection-canon-omega.ts'
      - 'src/atlas/algorithm/portfolio-selection-canon-omega.test.ts'
      - 'src/atlas/algorithm/endogenous-portfolio-engine-v2.ts'
      - 'src/atlas/algorithm/endogenous-portfolio-engine-v2.test.ts'
      - 'runtime/agentic_omega/capital_competition.py'
      - 'runtime/agentic_omega/universe_competition.py'
      - 'runtime/agentic_omega/portfolio_finalizer.py'
      - 'runtime/agentic_omega/security_snapshot.py'
      - 'runtime/agentic_omega/point_zero_rebuild.py'
      - 'runtime/agentic_omega/execution_control.py'
      - 'runtime/agentic_omega/test_universe_competition.py'
      - 'runtime/agentic_omega/test_portfolio_finalizer.py'
      - 'runtime/agentic_omega/test_point_zero_rebuild_pit.py'
      - 'runtime/agentic_omega/test_execution_control.py'
      - 'api/atlas_core_consolidated.py'
      - 'api/test_atlas_consolidated_boundary.py'
      - 'api/trading212_controlled.py'
      - 'api/test_broker_mount_authority.py'
      - 'api/test_trading212_v2.py'
      - 'data/t0-universe-user-seed-2026-09-05.txt'
      - 'data/atlas-core-universe-economic-entities-2026-09-06.txt'
      - 'tests/test_point_zero_universe_integrity.py'
  pull_request:
    paths:
      - '.github/workflows/architecture-consolidation-ci.yml'
      - 'src/atlas/algorithm/**'
      - 'runtime/agentic_omega/**'
      - 'api/atlas_core_consolidated.py'
      - 'api/trading212_controlled.py'
      - 'api/test_atlas_consolidated_boundary.py'
      - 'api/test_broker_mount_authority.py'
      - 'api/test_trading212_v2.py'
      - 'data/t0-universe-user-seed-2026-09-05.txt'
      - 'data/atlas-core-universe-economic-entities-2026-09-06.txt'
      - 'tests/test_point_zero_universe_integrity.py'

jobs:
  typescript-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run E1-E6 and Point Zero contracts
        run: >-
          npx --yes vitest@3.2.4 run --globals
          src/atlas/algorithm/atlas-kernel-contract-registry-omega.test.ts
          src/atlas/algorithm/e5-control-policy-omega.test.ts
          src/atlas/algorithm/e6-assurance-harness-policy-omega.test.ts
          src/atlas/algorithm/capital-blind-portfolio-selection-omega.test.ts
          src/atlas/algorithm/portfolio-selection-canon-omega.test.ts
          src/atlas/algorithm/endogenous-portfolio-engine-v2.test.ts

  python-boundaries:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install API test dependencies
        run: pip install -r api/requirements.txt
      - name: Run public, broker, universe, Point Zero, and execution-control tests
        run: >-
          python -m pytest -q
          api/test_atlas_consolidated_boundary.py
          api/test_broker_mount_authority.py
          api/test_trading212_v2.py
          tests/test_point_zero_universe_integrity.py
          runtime/agentic_omega/test_universe_competition.py
          runtime/agentic_omega/test_portfolio_finalizer.py
          runtime/agentic_omega/test_point_zero_rebuild_pit.py
          runtime/agentic_omega/test_execution_control.py
