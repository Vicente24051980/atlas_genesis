name: Mobile Functional Gate — Reuse Identical Candidate

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - opened
      - reopened
    paths:
      - 'mobile/scripts/android-functional-smoke.sh'
      - '.github/workflows/mobile-functional-reuse-check.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  functional-emulator-gate:
    name: Functional Android Emulator Gate — Reused Candidate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current functional test code
        uses: actions/checkout@v4

      # The APK in run 31276389524 was built after the functional app source
      # changes and before only the smoke-test script changed. Reusing it avoids
      # a second 22-minute native compile while testing the exact same app bytes.
      - name: Download byte-identical candidate APK
        uses: actions/download-artifact@v4
        with:
          name: atlas-omega-candidate-apk
          path: candidate-apk
          github-token: ${{ github.token }}
          run-id: 31276389524

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch APK and verify every functional route
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash mobile/scripts/android-functional-smoke.sh

      - name: Publish APK only after functional gate passes
        uses: actions/upload-artifact@v4
        with:
          name: atlas-omega-functional-apk
          path: candidate-apk/*.apk
          if-no-files-found: error
