name: ATLAS Mobile + Agentic Live Backend Smoke

on:
  push:
    branches: [main]
    paths:
      - api/**
      - runtime/agentic_omega/**
      - render.yaml
      - .github/workflows/mobile-live-backend-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-production-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify local production route contract
        shell: bash
        run: |
          set -euo pipefail
          pip install -r api/requirements.txt
          PYTHONPATH=. pytest -q api/test_deployment_contract.py api/test_mobile_entrypoints.py

  kick-render-deploy:
    needs: local-production-contract
    runs-on: ubuntu-latest
    timeout-minutes: 7
    outputs:
      live_smoke_enabled: ${{ steps.deploy.outputs.live_smoke_enabled }}
      deploy_trigger: ${{ steps.deploy.outputs.deploy_trigger }}
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      ATLAS_PRODUCTION_API: ${{ vars.ATLAS_PRODUCTION_API }}
    steps:
      - id: deploy
        name: Trigger Render deploy or verify Git auto-deploy
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            code=$(curl -sS --max-time 30 -o /tmp/render-deploy.json -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL" || true)
            test "$code" = 200 -o "$code" = 201 -o "$code" = 202 || { cat /tmp/render-deploy.json 2>/dev/null || true; echo "Render deploy hook failed: HTTP $code"; exit 1; }
            echo "deploy_trigger=hook" >> "$GITHUB_OUTPUT"
            echo "live_smoke_enabled=true" >> "$GITHUB_OUTPUT"
            echo "RENDER_DEPLOY_TRIGGER=hook"
            exit 0
          fi

          if [ -z "${RENDER_API_KEY:-}" ]; then
            BASE="${ATLAS_PRODUCTION_API:-https://atlas-genesis.onrender.com}"
            BASE="${BASE%/}"
            echo "RENDER_DEPLOY_TRIGGER=git_auto_deploy_preflight"
            echo "No Render deploy credential is configured. Waiting up to five minutes for the Git-linked Render service to auto-deploy."
            for attempt in $(seq 1 30); do
              mobile=$(curl -sS --max-time 20 -o /tmp/mobile.json -w "%{http_code}" "$BASE/v1/mobile/health" || true)
              gov=$(curl -sS --max-time 20 -o /tmp/gov.json -w "%{http_code}" "$BASE/v1/agentic-omega/v2/governance/capabilities" || true)
              openapi=$(curl -sS --max-time 20 -o /tmp/openapi.json -w "%{http_code}" "$BASE/openapi.json" || true)
              echo "preflight=$attempt base=$BASE mobile=$mobile governance=$gov openapi=$openapi"
              if [ "$mobile" = 200 ] && [ "$gov" = 200 ] && [ "$openapi" = 200 ] && python3 - <<'PY'
          import json
          m=json.load(open('/tmp/mobile.json')); g=json.load(open('/tmp/gov.json')); o=json.load(open('/tmp/openapi.json'))
          assert m.get('ok') is True and m.get('service')=='atlas-mobile-v2'
          assert g.get('version')=='2.3-governance-evidence'
          paths=set((o.get('paths') or {}).keys())
          required={'/v1/mobile/health','/v1/mobile/indices','/v1/mobile/company/{ticker}','/v1/mobile/catalysts','/v1/mobile/audit/{ticker}','/v1/mobile/broker/status'}
          assert required <= paths
          PY
              then
                echo "deploy_trigger=git_auto_deploy" >> "$GITHUB_OUTPUT"
                echo "live_smoke_enabled=true" >> "$GITHUB_OUTPUT"
                echo "Render Git auto-deploy exposed the current ATLAS contract."
                exit 0
              fi
              sleep 10
            done

            root=$(curl -sS --max-time 20 -o /tmp/root.json -w "%{http_code}" "$BASE/health" || true)
            echo "production_root_http=$root"
            echo "production_root_body_begin"
            head -c 1200 /tmp/root.json 2>/dev/null || true
            echo
            echo "production_root_body_end"
            echo "::error title=Render production deployment drift::The configured production host is reachable, but it did not expose the current ATLAS mobile/OpenAPI contract after five minutes. GitHub has no RENDER_DEPLOY_HOOK_URL or RENDER_API_KEY, so Actions cannot force a Render deploy. Relink the Render service source to Vicente24051980/atlas_genesis main or configure one of those GitHub Actions secrets."
            echo "deploy_trigger=blocked_no_render_auth" >> "$GITHUB_OUTPUT"
            echo "live_smoke_enabled=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          SERVICE_ID="${RENDER_SERVICE_ID:-}"
          if [ -z "$SERVICE_ID" ]; then
            curl -fsS --max-time 30 -H "Accept: application/json" -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services?limit=100" > /tmp/render-services.json
            SERVICE_ID=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/render-services.json'))
          preferred=('atlas-genesis','atlas-genesis-api')
          found=[]
          for item in data if isinstance(data,list) else []:
              s=item.get('service',item) if isinstance(item,dict) else {}
              if s.get('name') in preferred and s.get('id'):
                  found.append((preferred.index(s['name']),s['id']))
          if found: print(sorted(found)[0][1])
          PY
            )
          fi
          test -n "$SERVICE_ID" || { echo "ERROR: Render service could not be resolved."; exit 1; }
          code=$(curl -sS --max-time 30 -o /tmp/render-api-deploy.json -w "%{http_code}" -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" -H "Accept: application/json" -H "Content-Type: application/json" -H "Authorization: Bearer $RENDER_API_KEY" --data "{\"commitId\":\"$GITHUB_SHA\",\"clearCache\":\"do_not_clear\"}" || true)
          test "$code" = 201 -o "$code" = 202 || { cat /tmp/render-api-deploy.json 2>/dev/null || true; echo "Render API deploy failed: HTTP $code"; exit 1; }
          echo "deploy_trigger=api" >> "$GITHUB_OUTPUT"
          echo "live_smoke_enabled=true" >> "$GITHUB_OUTPUT"
          echo "RENDER_DEPLOY_TRIGGER=api"

  resolve-render-host:
    needs: kick-render-deploy
    if: needs.kick-render-deploy.outputs.live_smoke_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      production_api: ${{ steps.resolve.outputs.production_api }}
    env:
      ATLAS_PRODUCTION_API: ${{ vars.ATLAS_PRODUCTION_API }}
    steps:
      - id: resolve
        name: Resolve and certify deployed ATLAS production surface
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATES=()
          if [ -n "${ATLAS_PRODUCTION_API:-}" ]; then
            CANDIDATES+=("${ATLAS_PRODUCTION_API%/}")
          fi
          CANDIDATES+=("https://atlas-genesis.onrender.com" "https://atlas-genesis-api.onrender.com")
          UNIQUE=()
          for BASE in "${CANDIDATES[@]}"; do
            seen=false
            for existing in "${UNIQUE[@]}"; do
              if [ "$existing" = "$BASE" ]; then seen=true; fi
            done
            if [ "$seen" = false ]; then UNIQUE+=("$BASE"); fi
          done
          for attempt in $(seq 1 80); do
            for BASE in "${UNIQUE[@]}"; do
              root=$(curl -sS --max-time 25 -o /tmp/root.json -w "%{http_code}" "$BASE/health" || true)
              mobile=$(curl -sS --max-time 25 -o /tmp/mobile.json -w "%{http_code}" "$BASE/v1/mobile/health" || true)
              gov=$(curl -sS --max-time 25 -o /tmp/gov.json -w "%{http_code}" "$BASE/v1/agentic-omega/v2/governance/capabilities" || true)
              openapi=$(curl -sS --max-time 25 -o /tmp/openapi.json -w "%{http_code}" "$BASE/openapi.json" || true)
              echo "probe=$attempt base=$BASE root=$root mobile=$mobile governance=$gov openapi=$openapi"
              if [ "$mobile" = 200 ] && [ "$gov" = 200 ] && [ "$openapi" = 200 ] && python3 - <<'PY'
          import json
          m=json.load(open('/tmp/mobile.json')); g=json.load(open('/tmp/gov.json')); o=json.load(open('/tmp/openapi.json'))
          assert m.get('ok') is True and m.get('service')=='atlas-mobile-v2'
          assert g.get('version')=='2.3-governance-evidence'
          assert g.get('unknownCapabilityFailsClosed') is True
          assert g.get('credentialValuesPersisted') is False
          paths=set((o.get('paths') or {}).keys())
          required={
              '/v1/mobile/health',
              '/v1/mobile/indices',
              '/v1/mobile/company/{ticker}',
              '/v1/mobile/catalysts',
              '/v1/mobile/audit/{ticker}',
              '/v1/mobile/broker/status',
              '/v1/mobile/broker/account',
              '/v1/mobile/broker/positions',
              '/v1/mobile/broker/orders',
              '/v1/mobile/broker/metadata/instruments/search',
          }
          missing=sorted(required-paths)
          assert not missing, f'production deployment drift; missing routes: {missing}'
          PY
              then
                echo "production_api=$BASE" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            sleep 15
          done
          echo "ERROR: deployed Render service never exposed the required current ATLAS mobile surface."
          echo "Production deployment drift is a hard failure; do not ship an APK against a backend returning route 404s."
          exit 1

  live-atlas-api:
    needs: resolve-render-host
    if: needs.resolve-render-host.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ATLAS_PRODUCTION_API: ${{ needs.resolve-render-host.outputs.production_api }}
    steps:
      - name: Certify Mobile + Agentic read-only surfaces
        shell: bash
        run: |
          set -euo pipefail
          BASE="$ATLAS_PRODUCTION_API"
          for path in health v1/mobile/health v1/agentic-omega/health v1/agentic-omega/v2/capabilities v1/agentic-omega/v2/evidence-capabilities v1/agentic-omega/v2/governance/capabilities v1/mobile/portfolio v1/mobile/broker/status v1/mobile/catalysts openapi.json; do curl -fsS --max-time 30 "$BASE/$path" >/dev/null; done
          curl -fsS --max-time 30 "$BASE/openapi.json" > /tmp/openapi.json
          python3 - <<'PY'
          import json
          paths=set((json.load(open('/tmp/openapi.json')).get('paths') or {}).keys())
          required={'/v1/mobile/indices','/v1/mobile/catalysts','/v1/mobile/audit/{ticker}','/v1/mobile/broker/status'}
          missing=sorted(required-paths)
          assert not missing, f'missing certified mobile routes: {missing}'
          PY
          echo LIVE_ATLAS_AGENTIC_V23_PASS
