name: ATLAS Mobile + Agentic Live Backend Smoke

on:
  push:
    branches: [main]
    paths:
      - api/**
      - runtime/agentic_omega/**
      - render.yaml
      - .github/workflows/mobile-live-backend-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kick-render-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Trigger real Render deploy (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RENDER_DEPLOY_HOOK_URL:-}" ]; then
            code=$(curl -sS --max-time 30 -o /tmp/render-deploy.json -w "%{http_code}" -X POST "$RENDER_DEPLOY_HOOK_URL" || true)
            test "$code" = 200 -o "$code" = 201 -o "$code" = 202 || { cat /tmp/render-deploy.json 2>/dev/null || true; echo "Render deploy hook failed: HTTP $code"; exit 1; }
            echo "RENDER_DEPLOY_TRIGGER=hook"
            exit 0
          fi
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "ERROR: no Render deployment credential is configured. Refusing false-green CI."
            echo "Configure RENDER_DEPLOY_HOOK_URL or RENDER_API_KEY (+ optional RENDER_SERVICE_ID) in GitHub Actions secrets."
            exit 1
          fi
          SERVICE_ID="${RENDER_SERVICE_ID:-}"
          if [ -z "$SERVICE_ID" ]; then
            curl -fsS --max-time 30 -H "Accept: application/json" -H "Authorization: Bearer $RENDER_API_KEY" "https://api.render.com/v1/services?limit=100" > /tmp/render-services.json
            SERVICE_ID=$(python3 - <<'PY'
          import json
          data=json.load(open('/tmp/render-services.json'))
          preferred=('atlas-genesis','atlas-genesis-api')
          found=[]
          for item in data if isinstance(data,list) else []:
              s=item.get('service',item) if isinstance(item,dict) else {}
              if s.get('name') in preferred and s.get('id'):
                  found.append((preferred.index(s['name']),s['id']))
          if found: print(sorted(found)[0][1])
          PY
            )
          fi
          test -n "$SERVICE_ID" || { echo "ERROR: Render service could not be resolved."; exit 1; }
          code=$(curl -sS --max-time 30 -o /tmp/render-api-deploy.json -w "%{http_code}" -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" -H "Accept: application/json" -H "Content-Type: application/json" -H "Authorization: Bearer $RENDER_API_KEY" --data "{\"commitId\":\"$GITHUB_SHA\",\"clearCache\":\"do_not_clear\"}" || true)
          test "$code" = 201 -o "$code" = 202 || { cat /tmp/render-api-deploy.json 2>/dev/null || true; echo "Render API deploy failed: HTTP $code"; exit 1; }
          echo "RENDER_DEPLOY_TRIGGER=api"

  resolve-render-host:
    needs: kick-render-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    outputs:
      production_api: ${{ steps.resolve.outputs.production_api }}
    steps:
      - id: resolve
        name: Resolve deployed ATLAS production surface
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATES=("https://atlas-genesis.onrender.com" "https://atlas-genesis-api.onrender.com")
          for attempt in $(seq 1 36); do
            for BASE in "${CANDIDATES[@]}"; do
              mobile=$(curl -sS --max-time 25 -o /tmp/mobile.json -w "%{http_code}" "$BASE/v1/mobile/health" || true)
              gov=$(curl -sS --max-time 25 -o /tmp/gov.json -w "%{http_code}" "$BASE/v1/agentic-omega/v2/governance/capabilities" || true)
              echo "probe=$attempt base=$BASE mobile=$mobile governance=$gov"
              if [ "$mobile" = 200 ] && [ "$gov" = 200 ] && python3 - <<'PY'
          import json
          m=json.load(open('/tmp/mobile.json')); g=json.load(open('/tmp/gov.json'))
          assert m.get('ok') is True and m.get('service')=='atlas-mobile-v2'
          assert g.get('version')=='2.3-governance-evidence'
          assert g.get('unknownCapabilityFailsClosed') is True
          assert g.get('credentialValuesPersisted') is False
          PY
              then
                echo "production_api=$BASE" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            sleep 10
          done
          echo "ERROR: deployed Render service never exposed required ATLAS surfaces."
          exit 1

  live-atlas-api:
    needs: resolve-render-host
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ATLAS_PRODUCTION_API: ${{ needs.resolve-render-host.outputs.production_api }}
    steps:
      - name: Certify Mobile + Agentic read-only surfaces
        shell: bash
        run: |
          set -euo pipefail
          BASE="$ATLAS_PRODUCTION_API"
          for path in health v1/mobile/health v1/agentic-omega/health v1/agentic-omega/v2/capabilities v1/agentic-omega/v2/evidence-capabilities v1/agentic-omega/v2/governance/capabilities v1/mobile/portfolio v1/mobile/broker/status; do curl -fsS --max-time 30 "$BASE/$path" >/dev/null; done
          echo LIVE_ATLAS_AGENTIC_V23_PASS
