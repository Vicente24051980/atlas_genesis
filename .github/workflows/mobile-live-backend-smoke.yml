name: ATLAS Ω Mobile Live Backend Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-live-backend-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-mobile-api:
    name: Verify deployed /v1/mobile contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Render deployment and verify health
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://atlas-genesis.onrender.com'
          ok=0
          for attempt in $(seq 1 30); do
            code=$(curl -sS --max-time 25 -o /tmp/mobile-health.json -w '%{http_code}' "$BASE/v1/mobile/health" || true)
            if [ "$code" = '200' ] && python3 - <<'PY'
import json
p=json.load(open('/tmp/mobile-health.json'))
assert p.get('ok') is True
assert p.get('service') == 'atlas-mobile-v2'
PY
            then
              ok=1
              break
            fi
            echo "waiting for Render mobile contract: attempt $attempt, HTTP $code"
            sleep 10
          done
          test "$ok" = '1'
          cat /tmp/mobile-health.json

      - name: Verify portfolio and company fallback/live provider
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://atlas-genesis.onrender.com'
          curl -fsS --max-time 30 "$BASE/v1/mobile/portfolio" -o /tmp/portfolio.json
          curl -fsS --max-time 45 "$BASE/v1/mobile/company/MSFT" -o /tmp/company.json
          python3 - <<'PY'
import json
h=json.load(open('/tmp/mobile-health.json'))
p=json.load(open('/tmp/portfolio.json'))
c=json.load(open('/tmp/company.json'))
assert p.get('count') == 36, p
assert len(p.get('items') or []) == 36, p
assert c.get('symbol') == 'MSFT', c
assert c.get('provider') in {'FinancialData.Net','Finnhub'}, c
assert isinstance(c.get('summary'), dict) and c['summary'].get('ticker') == 'MSFT', c
print('LIVE_MOBILE_API_PASS')
print('preferred_provider=', h.get('preferred_provider'))
print('financialdatanet_configured=', h.get('financialdatanet_configured'))
print('company_provider=', c.get('provider'))
PY
