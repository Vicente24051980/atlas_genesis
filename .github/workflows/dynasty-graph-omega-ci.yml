name: Dynasty Historical Graph Omega CI

on:
  pull_request:
    paths:
      - 'data/dynasty/**'
      - 'schemas/dynasty_graph.schema.json'
      - 'schemas/corporate_ownership_graph.schema.json'
      - 'scripts/validate_dynasty_graph.py'
      - '.github/workflows/dynasty-graph-omega-ci.yml'
  push:
    branches: [main]
    paths:
      - 'data/dynasty/**'
      - 'schemas/dynasty_graph.schema.json'
      - 'schemas/corporate_ownership_graph.schema.json'
      - 'scripts/validate_dynasty_graph.py'

jobs:
  validate-historical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate DINASTÍA HISTÓRICA Ω
        run: python scripts/validate_dynasty_graph.py
