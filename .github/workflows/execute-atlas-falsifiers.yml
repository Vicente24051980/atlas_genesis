name: Execute ATLAS falsifiers

on:
  push:
    branches:
      - research/execute-null-arm-elite-backtest-2026-09-06
    paths:
      - scripts/atlas_strategy_factory_null_arm.py
      - scripts/atlas_elite_capital_post_filing_backtest.py
      - .github/workflows/execute-atlas-falsifiers.yml

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance requests beautifulsoup4 lxml html5lib

      - name: Execute Strategy Factory null arm if absent
        env:
          ATLAS_NULL_REPLICATIONS: '500'
        run: |
          if [ -f research/executions/strategy_factory_null_arm/summary.json ]; then
            echo "Existing null-arm execution retained; no reason to consume another search trial."
          else
            python scripts/atlas_strategy_factory_null_arm.py
          fi

      - name: Execute Elite Capital post-filing backtest
        env:
          ATLAS_ELITE_PERMUTATIONS: '5000'
          ATLAS_13F_REQUEST_DELAY: '0.45'
        run: python scripts/atlas_elite_capital_post_filing_backtest.py

      - name: Commit execution outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/executions || true
          if git diff --cached --quiet; then
            echo "No execution output files to commit."
          else
            git commit -m "research(atlas): record falsifier execution outputs [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Upload execution artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-falsifier-execution
          path: research/executions
          if-no-files-found: warn
