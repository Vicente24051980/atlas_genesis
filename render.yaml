services:
  - type: web
    name: atlas-genesis-api
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FINNHUB_TOKEN
        sync: false
      - key: TRADING212_ENV
        value: demo
      - key: TRADING212_API_KEY
        sync: false
      - key: TRADING212_API_SECRET
        sync: false
      - key: ATLAS_BROKER_CONTROL_TOKEN
        sync: false
      - key: TRADING212_LIVE_TRADING_ENABLED
        value: "false"
