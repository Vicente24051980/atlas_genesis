services:
  - type: web
    name: atlas-genesis
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: commit
    buildCommand: >-
      pip install -r api/requirements.txt &&
      python -c "from api.app import app; paths={r.path for r in app.routes}; required={'/health','/v1/mobile/health','/v1/mobile/indices','/v1/mobile/company/{ticker}','/v1/mobile/catalysts','/v1/mobile/audit/{ticker}','/v1/mobile/broker/status','/v1/mobile/broker/account','/v1/mobile/broker/positions','/v1/mobile/broker/orders','/v1/mobile/broker/metadata/instruments/search','/v1/agentic-omega/health','/v1/agentic-omega/v2/capabilities','/v1/agentic-omega/v2/evidence-capabilities','/v1/agentic-omega/v2/governance/capabilities'}; missing=sorted(required-paths); assert not missing, f'Missing production routes: {missing}'"
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /v1/mobile/health
    envVars:
      - key: ATLAS_DEPLOY_REVISION
        value: "2026-08-26-mobile-route-contract-v3-catalysts"
      - key: FINANCIALDATANET_API_KEY
        sync: false
      - key: FINNHUB_TOKEN
        sync: false
      - key: TRADING212_ENV
        value: demo
      - key: TRADING212_API_KEY
        sync: false
      - key: TRADING212_API_SECRET
        sync: false
      - key: ATLAS_BROKER_CONTROL_TOKEN
        sync: false
      - key: TRADING212_LIVE_TRADING_ENABLED
        value: "false"
      - key: ATLAS_AGENT_CONTROL_TOKEN
        generateValue: true
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: N8N_WEBHOOK_SECRET
        generateValue: true
      - key: ATLAS_AGENTIC_LEDGER_PATH
        value: .atlas_state/agentic_omega/events.jsonl
