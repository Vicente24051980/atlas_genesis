services:
  - type: web
    name: atlas-omega-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FINNHUB_TOKEN
        sync: false
      - key: SEC_USER_AGENT
        sync: false
      - key: TRADING212_API_KEY
        sync: false
      - key: TRADING212_API_SECRET
        sync: false
      - key: TRADING212_ENV
        value: demo
      - key: ATLAS_BROKER_CONTROL_TOKEN
        sync: false
      - key: ATLAS_PORTFOLIO_READ_TOKEN
        sync: false
      - key: TRADING212_LIVE_TRADING_ENABLED
        value: "false"
      - key: CACHE_TTL_MS
        value: "15000"
