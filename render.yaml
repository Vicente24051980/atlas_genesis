services:
  - type: web
    name: atlas-genesis
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: FINANCIALDATANET_API_KEY
        sync: false
      - key: FINNHUB_TOKEN
        sync: false
      - key: TRADING212_ENV
        value: demo
      - key: TRADING212_API_KEY
        sync: false
      - key: TRADING212_API_SECRET
        sync: false
      - key: ATLAS_BROKER_CONTROL_TOKEN
        sync: false
      - key: TRADING212_LIVE_TRADING_ENABLED
        value: "false"
      - key: ATLAS_AGENT_CONTROL_TOKEN
        generateValue: true
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: N8N_WEBHOOK_SECRET
        generateValue: true
      - key: ATLAS_AGENTIC_LEDGER_PATH
        value: .atlas_state/agentic_omega/events.jsonl
